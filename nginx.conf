server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The Vite entry point must always be revalidated. Its referenced assets
    # are content-hashed, so caching an old index can leave a browser running
    # a previous version of the application after a container is replaced.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    # Vite changes these filenames whenever their contents change, making
    # long-lived caching safe for production assets.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # PDF.js is bundled as an ES-module worker. Browsers reject module workers
    # when nginx serves .mjs files with a generic binary MIME type.
    location ~* \.mjs$ {
        types {
            application/javascript mjs;
        }
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}
