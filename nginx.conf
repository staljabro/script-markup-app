server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # PDF.js is bundled as an ES-module worker. Browsers reject module workers
    # when nginx serves .mjs files with a generic binary MIME type.
    location ~* \.mjs$ {
        types {
            application/javascript mjs;
        }
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
